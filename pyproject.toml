[project]
name = "forgedb"
version = "0.1.0"
description = "ForgeDB is an in memory DB made using python"
readme = "README.md"
authors = [
    { name = "Sriman Chaudhuri", email = "srimanchaudhuri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
forgedb = "forgedb:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scratch"]
